name: Reels Inspector Build

on:
  push:
    branches: [main]
    paths:
      - 'reels-inspector/src/**'
      - 'reels-inspector/scripts/**'
      - 'reels-inspector/tests/**'
      - 'reels-inspector/package.json'
      - 'reels-inspector/README.md'
      - 'reels-inspector/PROJECT_PLAN.md'
      - 'reels-inspector/STATUS.md'
      - 'reels-inspector/ARCHITECTURE.md'
      - 'reels-inspector/BASELINE.md'
      - '.github/workflows/reels-inspector-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize renamed repository URLs
        shell: bash
        run: |
          git grep -Il 'https://github.com/sunsee83/dev-lab/' | while IFS= read -r file; do
            sed -i 's#https://github.com/sunsee83/dev-lab/#https://github.com/sunsee83/open_lab/#g' "$file"
          done

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build dependency
        working-directory: reels-inspector
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Unit tests
        working-directory: reels-inspector
        run: npm test

      - name: Build userscript
        working-directory: reels-inspector
        run: npm run build

      - name: Architecture and syntax checks
        working-directory: reels-inspector
        run: npm run check && node --check ri-retry.user.js

      - name: Commit generated userscript and URL migration
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git add -u
          if git diff --cached --quiet; then
            echo 'Generated userscript and repository URLs are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: migrate renamed repository URLs'
          git pull --rebase origin main
          git push
