name: Reels Inspector Build

on:
  push:
    branches: [main]
    paths:
      - 'reels-inspector/src/**'
      - 'reels-inspector/scripts/**'
      - 'reels-inspector/tests/**'
      - 'reels-inspector/package.json'
      - 'reels-inspector/README.md'
      - 'reels-inspector/PROJECT_PLAN.md'
      - 'reels-inspector/STATUS.md'
      - 'reels-inspector/ARCHITECTURE.md'
      - 'reels-inspector/BASELINE.md'
      - '.github/workflows/reels-inspector-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Migrate userscript namespace
        shell: bash
        run: |
          git grep -Il 'dev-lab/reels-inspector' -- ':!.github/**' | while IFS= read -r file; do
            sed -i 's#dev-lab/reels-inspector#open_lab/reels-inspector#g' "$file"
          done
          sed -i "s/export const VERSION = '3.2.15';/export const VERSION = '3.2.16';/" reels-inspector/src/version.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build dependency
        working-directory: reels-inspector
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Unit tests
        working-directory: reels-inspector
        run: npm test

      - name: Build userscript
        working-directory: reels-inspector
        run: npm run build

      - name: Architecture and syntax checks
        working-directory: reels-inspector
        run: npm run check && node --check ri-retry.user.js

      - name: Commit namespace migration and generated userscript
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git add -u reels-inspector
          if git diff --cached --quiet; then
            echo 'Namespace migration is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(reels-inspector): migrate namespace to open_lab'
          git pull --rebase origin main
          git push
