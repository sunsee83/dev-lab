<!doctype html><meta charset="utf-8"><script>(async()=>{const token=(location.hash||'').slice(1);try{const r=await fetch('./media-v062.js?x='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const code=await r.text();parent.postMessage({type:'RI_CURRENT_CODE',token,code},'*')}catch(e){parent.postMessage({type:'RI_CURRENT_ERROR',token,error:String(e?.message||e)},'*')}})()</script>
