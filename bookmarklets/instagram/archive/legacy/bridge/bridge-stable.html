<!doctype html><meta charset="utf-8"><script>(async()=>{const token=(location.hash||'').slice(1);const send=(m)=>{try{opener&&opener.postMessage(m,'*')}catch{}try{parent&&parent!==self&&parent.postMessage(m,'*')}catch{}};try{const base='https://raw.githubusercontent.com/sunsee83/dev-lab/main/bookmarklets/instagram/';const tr=await fetch(base+'current-target.txt?x='+Date.now(),{cache:'no-store'});if(!tr.ok)throw Error('target HTTP '+tr.status);const targets=(await tr.text()).split(/\r?\n/).map(s=>s.trim()).filter(Boolean);if(!targets.length||targets.some(t=>!/^[A-Za-z0-9._-]+\.js$/.test(t)))throw Error('invalid target');const parts=[];for(const target of targets){const cr=await fetch(base+target+'?x='+Date.now(),{cache:'no-store'});if(!cr.ok)throw Error('code HTTP '+cr.status+' '+target);parts.push(await cr.text())}send({type:'RI_STABLE_CODE',token,target:targets.join('+'),code:parts.join('\n;\n')})}catch(e){send({type:'RI_STABLE_ERROR',token,error:String(e?.message||e)})}})()</script>
