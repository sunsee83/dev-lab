<!doctype html><meta charset="utf-8"><script>(async()=>{const token=(location.hash||'').slice(1);const send=(m)=>{try{opener&&opener.postMessage(m,'*')}catch{}try{parent&&parent!==self&&parent.postMessage(m,'*')}catch{}};try{const base='https://raw.githubusercontent.com/sunsee83/dev-lab/main/bookmarklets/instagram/';const tr=await fetch(base+'current-target.txt?x='+Date.now(),{cache:'no-store'});if(!tr.ok)throw Error('target HTTP '+tr.status);const target=(await tr.text()).trim();if(!/^[A-Za-z0-9._-]+\.js$/.test(target))throw Error('invalid target');const cr=await fetch(base+target+'?x='+Date.now(),{cache:'no-store'});if(!cr.ok)throw Error('code HTTP '+cr.status);const code=await cr.text();send({type:'RI_STABLE_CODE',token,target,code})}catch(e){send({type:'RI_STABLE_ERROR',token,error:String(e?.message||e)})}})()</script>
