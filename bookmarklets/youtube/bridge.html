<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YouTube 수집</title>
<style>
:root{color-scheme:dark;--bg:#111;--card:#1b1b1b;--line:#333;--muted:#aaa;--fg:#f5f5f5;--accent:#fff;--danger:#ff8f8f}*{box-sizing:border-box}body{margin:0;background:transparent;color:var(--fg);font:14px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.panel{width:min(100%,520px);margin:0 auto;background:var(--bg);border:1px solid #444;border-radius:16px;box-shadow:0 12px 40px #0009;overflow:hidden}.head{display:flex;gap:10px;align-items:center;padding:12px;border-bottom:1px solid var(--line)}.thumb{width:74px;height:44px;object-fit:cover;border-radius:7px;background:#222}.meta{min-width:0;flex:1}.title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.close{border:0;background:#292929;color:#fff;border-radius:9px;padding:8px 10px}.body{max-height:72vh;overflow:auto;padding:12px}.section{padding:12px 0;border-top:1px solid var(--line)}.section:first-child{border-top:0;padding-top:0}.label{font-weight:700;margin-bottom:8px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.choice,.action,.small{border:1px solid #444;background:#222;color:#fff;border-radius:10px;padding:11px 8px}.choice.on{background:#f3f3f3;color:#111;border-color:#f3f3f3}.row{display:flex;gap:8px;align-items:center;margin:8px 0}.row>label{flex:1}.select,.input,.textarea{width:100%;background:#1d1d1d;color:#fff;border:1px solid #444;border-radius:9px;padding:10px}.textarea{min-height:64px;resize:vertical}.checks{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px}.check{display:flex;gap:7px;align-items:flex-start}.hidden{display:none!important}.stack{display:grid;gap:8px}.drive-step{padding:9px;background:var(--card);border-radius:10px}.inline{display:grid;grid-template-columns:1fr auto auto;gap:6px}.stars{display:flex;gap:8px}.star{font-size:26px;background:none;border:0;color:#666;padding:0}.star.on{color:#fff}.footer{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 12px;background:#151515;border-top:1px solid var(--line)}.footer .action{flex:1;font-weight:700}.status{padding:8px 12px;color:var(--muted);font-size:12px}.status.error{color:var(--danger)}.duplicate{background:#2a2315;border:1px solid #5a4820;border-radius:10px;padding:10px;margin-bottom:10px}.hint{font-size:12px;color:var(--muted);margin-top:5px}
</style>
</head>
<body>
<div class="panel">
  <div class="head">
    <img id="thumb" class="thumb" alt="">
    <div class="meta"><div id="title" class="title">YouTube 수집</div><div id="sub" class="sub">초기화 중…</div></div>
    <button id="closeTop" class="close">닫기</button>
  </div>
  <div id="body" class="body">
    <div id="dup" class="duplicate hidden"><b>이미 수집된 영상입니다.</b><div class="row"><button id="openExisting" class="small">기존 기록 열기</button></div></div>

    <section id="pickSection" class="section">
      <div class="label">1. 가져올 항목</div>
      <div id="typeChoices" class="choices">
        <button class="choice" data-type="video">영상</button>
        <button class="choice" data-type="audio">음성</button>
        <button class="choice" data-type="data">데이터</button>
      </div>
    </section>

    <section id="mediaOptions" class="section hidden">
      <div id="videoOptions" class="stack hidden"><div class="label">영상</div><select id="videoQuality" class="select"></select></div>
      <div id="audioOptions" class="stack hidden"><div class="label">음성</div><select id="audioQuality" class="select"></select></div>
    </section>

    <section id="dataOptions" class="section hidden">
      <div class="label">데이터</div>
      <div class="checks" id="fields">
        <label class="check"><input type="checkbox" value="thumbnail" checked>썸네일</label>
        <label class="check"><input type="checkbox" value="title" checked>제목</label>
        <label class="check"><input type="checkbox" value="url" checked>영상 URL</label>
        <label class="check"><input type="checkbox" value="channel" checked>채널명</label>
        <label class="check"><input type="checkbox" value="publishedAt" checked>업로드일</label>
        <label class="check"><input type="checkbox" value="duration" checked>영상 길이</label>
        <label class="check"><input type="checkbox" value="views" checked>조회수</label>
        <label class="check"><input type="checkbox" value="description" checked>설명</label>
        <label class="check"><input type="checkbox" value="tags" checked>태그</label>
        <label class="check"><input type="checkbox" value="transcript" checked>대본</label>
        <label class="check"><input id="commentsCheck" type="checkbox" value="comments">댓글</label>
        <label class="check"><input type="checkbox" value="likes">좋아요</label>
      </div>
      <div id="commentOptions" class="row hidden">
        <select id="commentCount" class="select"><option value="50">댓글 50개</option><option value="100" selected>댓글 100개</option><option value="300">댓글 300개</option></select>
        <select id="commentSort" class="select"><option value="top" selected>인기순</option><option value="newest">최신순</option></select>
      </div>
      <details style="margin-top:10px"><summary>고급 정보</summary><div class="checks" style="margin-top:9px"><label class="check"><input type="checkbox" value="videoId">영상 ID</label><label class="check"><input type="checkbox" value="channelId">채널 ID</label><label class="check"><input type="checkbox" value="language">영상 언어</label><label class="check"><input type="checkbox" value="rawMetadata">원본 메타데이터</label></div></details>
    </section>

    <section id="formatSection" class="section hidden">
      <div class="label">2. 데이터 형식</div>
      <select id="format" class="select"><option value="text" selected>원문 / TXT</option><option value="json">JSON</option></select>
    </section>

    <section id="targetSection" class="section hidden">
      <div class="label">3. 저장 위치</div>
      <div class="choices" style="grid-template-columns:1fr 1fr"><button class="choice" data-target="local">로컬</button><button class="choice" data-target="drive">Drive</button></div>
      <div id="localHint" class="hint hidden">저장할 때 Android 저장창에서 위치와 파일명을 선택합니다.</div>
    </section>

    <section id="driveOptions" class="section hidden">
      <div class="label">Drive 저장</div>
      <div class="drive-step"><div class="label">파일</div><div class="inline"><select id="driveFile" class="select"></select><button class="small" data-create="file">+ 새 파일</button><button class="small" data-open="file">열기</button></div></div>
      <div class="drive-step" style="margin-top:8px"><div class="label">시트</div><div class="inline"><select id="driveSheet" class="select"></select><button class="small" data-create="sheet">+ 새 시트</button><button class="small" data-open="sheet">열기</button></div></div>
      <div class="drive-step" style="margin-top:8px"><div class="label">카테고리</div><div class="inline" style="grid-template-columns:1fr auto"><select id="driveCategory" class="select"></select><button class="small" data-create="category">+ 새 카테고리</button></div></div>
    </section>

    <section id="manageOptions" class="section hidden">
      <div class="label">4. 관리정보</div>
      <input id="myTags" class="input" placeholder="내 태그">
      <div class="row"><span>중요도</span><div id="stars" class="stars"><button class="star" data-star="1">☆</button><button class="star" data-star="2">☆</button><button class="star" data-star="3">☆</button></div></div>
      <select id="status" class="select"><option>미분석</option><option>검토중</option><option>완료</option><option>보류</option></select>
      <textarea id="memo" class="textarea" placeholder="메모"></textarea>
    </section>

    <section id="duplicateOptions" class="section hidden"><div class="label">중복 처리</div><label class="check"><input type="radio" name="duplicate" value="update" checked>기존 기록 업데이트</label><label class="check"><input type="radio" name="duplicate" value="new">새 기록 추가</label></section>
  </div>
  <div id="statusLine" class="status">준비 중…</div>
  <div class="footer"><button id="run" class="action">저장</button><button id="closeBottom" class="action">닫기</button></div>
</div>
<script>
(()=>{
  const qs=s=>document.querySelector(s), qsa=s=>[...document.querySelectorAll(s)];
  const hp=new URLSearchParams(location.hash.replace(/^#/,''));
  const token=hp.get('token')||location.hash.replace(/^#/,'')||'';
  let init=null,types=new Set(),target='',priority=0;
  const send=m=>{m={...m,token};try{parent&&parent!==self&&parent.postMessage(m,'*')}catch{}try{opener&&opener.postMessage(m,'*')}catch{}};
  const show=(id,on)=>qs(id).classList.toggle('hidden',!on);
  const fill=(sel,arr,empty='없음')=>{const e=qs(sel);e.textContent='';if(!arr?.length){const o=document.createElement('option');o.value='';o.textContent=empty;e.appendChild(o);return}for(const x of arr){const o=document.createElement('option');o.value=String(x.value??x.id??x.name??x.label??'');o.textContent=String(x.label??x.name??x.value??'');e.appendChild(o)}};
  const status=(m,err=false)=>{const e=qs('#statusLine');e.textContent=m||'';e.classList.toggle('error',!!err)};
  function render(){
    const hasV=types.has('video'),hasA=types.has('audio'),hasD=types.has('data');
    show('#mediaOptions',hasV||hasA);show('#videoOptions',hasV);show('#audioOptions',hasA);show('#dataOptions',hasD);show('#formatSection',hasD);show('#targetSection',types.size>0);show('#localHint',!!target&&target==='local');show('#driveOptions',target==='drive');show('#manageOptions',hasD&&target==='drive');show('#duplicateOptions',!!init?.duplicate&&hasD&&target==='drive');
    qsa('[data-type]').forEach(b=>b.classList.toggle('on',types.has(b.dataset.type)));qsa('[data-target]').forEach(b=>b.classList.toggle('on',target===b.dataset.target));
    qs('#run').textContent=types.size?`${[...types].map(x=>x==='video'?'영상':x==='audio'?'음성':'데이터').join('+')} 저장`:'저장';
  }
  function initialize(d){
    init=d;const v=d.video||{};qs('#title').textContent=v.title||'YouTube 수집';qs('#sub').textContent=[v.channel,v.publishedAt,v.duration,v.views].filter(Boolean).join(' · ')||'항목을 선택하세요';if(v.thumbnail){qs('#thumb').src=v.thumbnail;qs('#thumb').style.visibility='visible'}else qs('#thumb').style.visibility='hidden';
    fill('#videoQuality',d.media?.video||[],'가능한 영상 없음');fill('#audioQuality',d.media?.audio||[],'가능한 음성 없음');fill('#driveFile',d.drive?.files||[],'파일 선택');fill('#driveSheet',d.drive?.sheets||[],'시트 선택');fill('#driveCategory',d.drive?.categories||[],'카테고리 선택');show('#dup',!!d.duplicate);status('준비됨');
    if(d.mode==='media'){types=new Set(['video']);}else if(d.mode==='collect'){types=new Set(['data']);}render();
  }
  qsa('[data-type]').forEach(b=>b.onclick=()=>{const t=b.dataset.type;types.has(t)?types.delete(t):types.add(t);render()});
  qsa('[data-target]').forEach(b=>b.onclick=()=>{target=b.dataset.target;render()});
  qs('#commentsCheck').onchange=e=>show('#commentOptions',e.target.checked);
  qsa('[data-star]').forEach(b=>b.onclick=()=>{priority=+b.dataset.star===priority?0:+b.dataset.star;qsa('[data-star]').forEach(x=>{x.classList.toggle('on',+x.dataset.star<=priority);x.textContent=+x.dataset.star<=priority?'★':'☆'})});
  qsa('[data-create]').forEach(b=>b.onclick=()=>{const kind=b.dataset.create,name=prompt(kind==='file'?'새 파일 이름':kind==='sheet'?'새 시트 이름':'새 카테고리 이름');if(name?.trim())send({type:'YT_BM_ACTION',action:'create-drive-item',kind,name:name.trim()})});
  qsa('[data-open]').forEach(b=>b.onclick=()=>send({type:'YT_BM_ACTION',action:'open-drive-item',kind:b.dataset.open,file:qs('#driveFile').value,sheet:qs('#driveSheet').value}));
  qs('#openExisting').onclick=()=>send({type:'YT_BM_ACTION',action:'open-existing'});
  const close=()=>send({type:'YT_BM_ACTION',action:'close'});qs('#closeTop').onclick=close;qs('#closeBottom').onclick=close;
  qs('#run').onclick=()=>{
    if(!types.size)return status('가져올 항목을 선택하세요.',true);if(!target)return status('저장 위치를 선택하세요.',true);
    const base={type:'YT_BM_ACTION',action:'save',types:[...types],target};
    if(types.has('video'))base.videoQuality=qs('#videoQuality').value;if(types.has('audio'))base.audioQuality=qs('#audioQuality').value;
    if(types.has('data')){base.fields=qsa('#fields input:checked,details input:checked').map(x=>x.value);base.format=qs('#format').value;base.comments={count:+qs('#commentCount').value,sort:qs('#commentSort').value};base.management={tags:qs('#myTags').value.trim(),priority,status:qs('#status').value,memo:qs('#memo').value};base.duplicate=qsa('input[name="duplicate"]:checked')[0]?.value||'update'}
    if(target==='drive')base.drive={file:qs('#driveFile').value,sheet:qs('#driveSheet').value,category:qs('#driveCategory').value};
    status('처리 요청 중…');send(base);
  };
  addEventListener('message',e=>{const d=e.data||{};if(d.token!==token)return;if(d.type==='YT_BM_INIT')initialize(d);if(d.type==='YT_BM_STATUS')status(d.message,d.state==='error');if(d.type==='YT_BM_DRIVE_OPTIONS'){fill('#driveFile',d.files||init?.drive?.files||[],'파일 선택');fill('#driveSheet',d.sheets||init?.drive?.sheets||[],'시트 선택');fill('#driveCategory',d.categories||init?.drive?.categories||[],'카테고리 선택')}});
  send({type:'YT_BM_READY'});setTimeout(()=>{if(!init)status('북마클릿 연결을 기다리는 중…')},1200);
})();
</script>
</body>
</html>
