<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>유튜브다운로드</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:#0f0f0f;color:#f4f4f4}.app{width:min(100%,480px);margin:auto;min-height:100vh;background:#111}.screen{padding:14px}.hidden{display:none!important}.title{font-size:20px;font-weight:800}.muted,.note,.status{color:#aaa;font-size:12px;line-height:1.45}.divider{height:1px;background:#2b2b2b;margin:15px 0}.section-title,.label,.sub{font-weight:800}.section-title{margin-bottom:9px}.label{display:block;margin-bottom:6px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.btn,.select,.input,.textarea{font:inherit;border:1px solid #3a3a3a;background:#1b1b1b;color:#fff;border-radius:11px;min-height:44px}.btn{padding:10px 12px;font-weight:700}.btn.primary,.btn.on{background:#fff;color:#111;border-color:#fff}.btn.small{min-height:39px;padding:8px 9px;font-size:13px}.btn:disabled{opacity:.45}.select,.input,.textarea{width:100%;padding:10px}.textarea{min-height:76px}.box{margin-top:11px;padding:12px;border:1px solid #2c2c2c;border-radius:12px;background:#151515}.header{display:grid;grid-template-columns:92px 1fr;gap:11px}.thumb{width:92px;height:52px;object-fit:cover;border-radius:8px;background:#222}.video-title{font-weight:800;font-size:15px;line-height:1.35;max-height:42px;overflow:hidden}.meta{margin-top:4px;color:#aaa;font-size:12px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}.check{display:flex;gap:7px;align-items:flex-start;font-size:14px}.check input{margin-top:2px;transform:scale(1.1)}.two{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}.arrow{text-align:center;color:#777;margin:4px}.stars{display:flex;gap:5px}.star{font-size:25px;border:0;background:none;color:#777;padding:2px}.star.on{color:#fff}.duplicate{padding:12px;border:1px solid #6c5825;background:#261f10;border-radius:12px}.footer{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sp{height:11px}.drive-row{display:grid;grid-template-columns:50px 1fr;gap:8px;align-items:center;margin-top:9px}.widget{min-height:42px;display:flex;align-items:center;overflow:hidden}details{margin-top:11px;border-top:1px solid #292929;padding-top:9px}@media(max-width:350px){.checks{grid-template-columns:1fr}.header{grid-template-columns:76px 1fr}.thumb{width:76px;height:43px}}
</style>
<div class="app" id="app">
<section id="setup" class="screen">
  <div class="title">유튜브다운로드 설정</div>
  <div class="box">
    <div class="sub">Google 저장공간 준비</div><div class="sp"></div>
    <div class="note">처음 사용하는 계정은 Google 승인이 필요합니다. 승인 후 기본 저장공간 <b>유튜브다운로드sheet_v1</b>을 자동으로 만듭니다.</div><div class="sp"></div>
    <button id="googleConnect" class="btn primary" style="width:100%">Google 승인 창 열기</button><div class="sp"></div>
    <button id="createStorage" class="btn" style="width:100%">저장공간 다시 준비</button><div id="setupStatus" class="status">연결 확인 중…</div>
  </div>
</section>
<section id="main" class="screen hidden">
  <div class="title">유튜브다운로드</div><div class="divider"></div>
  <div class="header"><img id="thumb" class="thumb" alt="썸네일"><div><div id="videoTitle" class="video-title">영상 제목</div><div id="videoMeta" class="meta"></div></div></div>
  <div class="divider"></div><div class="section-title">1. 가져올 항목</div>
  <div class="grid3"><button class="btn type" data-type="video">영상</button><button class="btn type" data-type="audio">음성</button><button class="btn type" data-type="data">데이터</button></div><div class="note">복수 선택 가능</div>
  <div id="videoOptions" class="box hidden"><label class="label">영상 화질</label><select id="videoQuality" class="select"></select></div>
  <div id="audioOptions" class="box hidden"><label class="label">음성 음질</label><select id="audioQuality" class="select"></select></div>
  <div id="dataOptions" class="box hidden">
    <div class="sub">기본정보</div><div class="sp"></div>
    <div class="checks"><label class="check"><input type="checkbox" value="thumbnail" checked>썸네일</label><label class="check"><input type="checkbox" value="title" checked>제목</label><label class="check"><input type="checkbox" value="url" checked>영상 URL</label><label class="check"><input type="checkbox" value="channel" checked>채널명</label><label class="check"><input type="checkbox" value="publishedAt" checked>업로드일</label><label class="check"><input type="checkbox" value="duration" checked>영상 길이</label><label class="check"><input type="checkbox" value="views" checked>조회수</label></div>
    <div class="sp"></div><div class="sub">내용</div><div class="sp"></div>
    <div class="checks"><label class="check"><input type="checkbox" value="description" checked>설명</label><label class="check"><input type="checkbox" value="tags" checked>태그</label><label class="check"><input type="checkbox" value="transcript" checked>대본</label><label class="check"><input id="commentsCheck" type="checkbox" value="comments">댓글</label></div>
    <div id="commentOptions" class="grid2 hidden" style="margin-top:10px"><select id="commentCount" class="select"><option value="50">댓글 50개</option><option value="100" selected>댓글 100개</option><option value="300">댓글 300개</option></select><select id="commentSort" class="select"><option value="top">인기순</option><option value="newest">최신순</option></select></div>
    <details><summary>고급</summary><div class="checks" style="margin-top:10px"><label class="check"><input type="checkbox" value="likes">좋아요</label><label class="check"><input type="checkbox" value="rawCaptions">자막 원본</label><label class="check"><input type="checkbox" value="videoId">영상 ID</label><label class="check"><input type="checkbox" value="channelId">채널 ID</label><label class="check"><input type="checkbox" value="rawMetadata">원본 메타데이터</label></div></details>
  </div>
  <div id="formatSection" class="hidden"><div class="divider"></div><div class="section-title">2. 데이터 형식</div><select id="dataFormat" class="select"><option value="original">원문</option><option value="txt">TXT</option><option value="json">JSON</option></select></div>
  <div class="divider"></div><div class="section-title">3. 저장 위치</div><div class="grid2"><button class="btn target" data-target="local">로컬</button><button class="btn target" data-target="drive">Drive</button></div>
  <div id="localOptions" class="box hidden"><div class="note">한 종류는 파일 선택창, 여러 종류는 폴더 선택창을 사용합니다.</div></div>
  <div id="driveOptions" class="box hidden">
    <div id="driveData" class="hidden"><label class="label">파일</label><select id="driveFile" class="select"></select><div class="two"><button id="connectFile" class="btn small">+ 기존 파일 연결</button><button id="openFile" class="btn small">열기</button></div><div class="arrow">↓</div><label class="label">시트</label><select id="driveSheet" class="select"></select><div class="two"><button id="newSheet" class="btn small">+ 새 시트</button><button id="openSheet" class="btn small">열기</button></div><div class="arrow">↓</div><label class="label">카테고리</label><select id="driveCategory" class="select"></select><button id="newCategory" class="btn small" style="width:100%;margin-top:7px">+ 새 카테고리</button></div>
    <div id="driveMedia" class="hidden"><div class="sub" style="margin-top:12px">Drive에 저장</div><div id="driveVideoRow" class="drive-row hidden"><b>영상</b><div id="driveVideoWidget" class="widget"></div></div><div id="driveAudioRow" class="drive-row hidden"><b>음성</b><div id="driveAudioWidget" class="widget"></div></div></div>
  </div>
  <div id="management" class="hidden"><div class="divider"></div><div class="section-title">4. 관리정보</div><label class="label">내 태그</label><input id="myTags" class="input"><div class="sp"></div><label class="label">활용 목적</label><select id="purpose" class="select"><option value="">선택 안 함</option><option>공부</option><option>자료조사</option><option>아이디어</option><option>보관</option></select><div class="sp"></div><div class="label">중요도</div><div class="stars"><button class="star" data-star="1">☆</button><button class="star" data-star="2">☆</button><button class="star" data-star="3">☆</button><button class="star" data-star="4">☆</button><button class="star" data-star="5">☆</button></div><div class="sp"></div><label class="label">상태</label><select id="state" class="select"><option>미분석</option><option>분석중</option><option>완료</option><option>보류</option></select><div class="sp"></div><label class="label">메모</label><textarea id="memo" class="textarea"></textarea><div class="sp"></div><label class="check"><input id="aiSend" type="checkbox">AI에게 보낼 항목으로 표시</label></div>
  <div id="duplicate" class="hidden"><div class="divider"></div><div class="duplicate"><b>이미 수집된 영상입니다.</b><div class="sp"></div><button id="openExisting" class="btn" style="width:100%">기존 기록 열기</button><div class="sp"></div><label><input type="radio" name="dup" value="update" checked> 업데이트</label>&nbsp;&nbsp;<label><input type="radio" name="dup" value="new"> 새 기록 추가</label></div></div>
  <div class="divider"></div><div class="footer"><button id="save" class="btn primary">저장</button><button id="close" class="btn">닫기</button></div><div id="status" class="status">준비 중…</div>
</section>
</div>
<script>
(()=>{
const root=document.getElementById('app'),q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];
let token='';try{token=parent.__YTDL_TOKEN||''}catch{}
const S={configured:false,types:new Set(),target:'',priority:0,duplicate:null,busy:false,init:null,driveMedia:{video:false,audio:false}};
const LABEL={thumbnail:'썸네일',title:'제목',url:'영상 URL',channel:'채널명',publishedAt:'업로드일',duration:'영상 길이',views:'조회수',description:'설명',tags:'태그',transcript:'대본',comments:'댓글',likes:'좋아요',rawCaptions:'자막 원본',videoId:'영상 ID',channelId:'채널 ID',rawMetadata:'원본 메타데이터'};
let driveApi=null;
function emit(o){o={...o,token};try{if(parent&&parent.__YTDL_RECV)return parent.__YTDL_RECV(o)}catch{}try{parent.postMessage(o,'*')}catch{}}
const action=(a,p={})=>emit({type:'YT_TOOL_ACTION',action:a,...p}),show=(s,on)=>q(s)?.classList.toggle('hidden',!on),status=(m,setup=false)=>(setup?q('#setupStatus'):q('#status')).textContent=m||'';
function fill(sel,list,empty,selected){const e=q(sel);if(!e)return;e.replaceChildren();for(const x of Array.isArray(list)?list:[]){if(x&&typeof x==='object'&&x.selectable===false)continue;const obj=typeof x==='string'?{value:x,label:x}:x||{},o=document.createElement('option');o.value=String(obj.value??obj.id??obj.name??'');o.textContent=String(obj.label??obj.name??obj.value??'');e.append(o)}if(!e.options.length){const o=document.createElement('option');o.value='';o.textContent=empty;e.append(o)}if(selected!=null&&[...e.options].some(o=>o.value===String(selected)))e.value=String(selected)}
function clearDrive(){S.driveMedia={video:false,audio:false};q('#driveVideoWidget').replaceChildren();q('#driveAudioWidget').replaceChildren();show('#driveVideoRow',false);show('#driveAudioRow',false);show('#driveMedia',false)}
function render(){show('#setup',!S.configured);show('#main',S.configured);if(!S.configured)return;const d=S.types.has('data');qa('.type').forEach(b=>b.classList.toggle('on',S.types.has(b.dataset.type)));qa('.target').forEach(b=>b.classList.toggle('on',S.target===b.dataset.target));show('#videoOptions',S.types.has('video'));show('#audioOptions',S.types.has('audio'));show('#dataOptions',d);show('#formatSection',d);show('#localOptions',S.target==='local');show('#driveOptions',S.target==='drive');show('#driveData',S.target==='drive'&&d);show('#management',S.target==='drive'&&d);show('#duplicate',!!S.duplicate);show('#driveMedia',S.target==='drive'&&(S.driveMedia.video||S.driveMedia.audio));q('#save').disabled=S.busy}
function applyOptions(d={}){if(d.files)fill('#driveFile',d.files,'파일 없음',d.selectedFileId);if(d.sheets)fill('#driveSheet',d.sheets,'시트 없음',d.selectedSheetName);if(d.categories)fill('#driveCategory',d.categories,'카테고리 없음',d.selectedCategory)}
function init(d){S.init=d;S.configured=d.configured!==false;const v=d.video||{};q('#videoTitle').textContent=v.title||'영상 제목';q('#videoMeta').textContent=[v.channel,v.publishedAt,v.duration,v.views].filter(Boolean).join(' · ');if(v.thumbnail)q('#thumb').src=v.thumbnail;fill('#videoQuality',d.media?.video,'가능한 영상 없음');fill('#audioQuality',d.media?.audio,'가능한 음성 없음');applyOptions(d.drive);S.duplicate=d.duplicate||null;clearDrive();render();status('준비됨')}
function payload(){const p={types:[...S.types],target:S.target};if(S.types.has('video'))p.video={id:q('#videoQuality').value};if(S.types.has('audio'))p.audio={id:q('#audioQuality').value};if(S.types.has('data')){p.data={fields:qa('#dataOptions input[type=checkbox]:checked').map(x=>x.value),format:q('#dataFormat').value};if(q('#commentsCheck').checked)p.data.comments={count:+q('#commentCount').value,sort:q('#commentSort').value}}if(S.target==='drive'&&S.types.has('data'))p.drive={fileId:q('#driveFile').value,sheetName:q('#driveSheet').value,category:q('#driveCategory').value};if(S.target==='drive'&&S.types.has('data'))p.management={tags:q('#myTags').value.trim(),purpose:q('#purpose').value,priority:S.priority,status:q('#state').value,memo:q('#memo').value,aiSend:q('#aiSend').checked};if(S.duplicate)p.duplicateMode=q('input[name=dup]:checked')?.value||'update';return p}
const val=v=>v==null?'':typeof v==='string'?v:Array.isArray(v)?v.map(x=>typeof x==='object'?JSON.stringify(x):String(x)).join(', '):typeof v==='object'?JSON.stringify(v,null,2):String(v);
function original(p){const r=p.result||{},e=p.errors||{},out=['유튜브다운로드',''];for(const k of ['title','url','channel','publishedAt','duration','views','likes','videoId','channelId','thumbnail'])if(k in r)out.push(`${LABEL[k]}: ${val(r[k])}`);for(const k of ['description','tags','transcript','comments','rawCaptions','rawMetadata'])if(k in r)out.push('',`[${LABEL[k]}]`,k==='transcript'?(r[k]?.text||val(r[k])):val(r[k]));if(Object.keys(e).length){out.push('','[가져오지 못한 항목]');for(const[k,v]of Object.entries(e))out.push(`- ${LABEL[k]||k}: ${v}`)}return '\uFEFF'+out.join('\n').trim()+'\n'}
function formatData(p,fmt){const x={videoId:p.videoId||'',requested:p.requested||[],result:p.result||{},errors:p.errors||{}};if(fmt==='json')return JSON.stringify(x,null,2)+'\n';if(fmt==='txt'){const out=[];for(const k of x.requested){if(k in x.result)out.push(`${LABEL[k]||k}: ${val(x.result[k])}`)}for(const[k,v]of Object.entries(x.errors))out.push(`오류(${LABEL[k]||k}): ${v}`);return '\uFEFF'+out.join('\n')+'\n'}return original(x)}
function loadDriveApi(){if(window.gapi?.savetodrive?.render)return Promise.resolve(window.gapi);if(driveApi)return driveApi;driveApi=new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://apis.google.com/js/platform.js';s.async=true;s.onload=()=>{let n=0,t=setInterval(()=>{if(window.gapi?.savetodrive?.render){clearInterval(t);resolve(window.gapi)}else if(++n>50){clearInterval(t);driveApi=null;reject(new Error('Google Drive 버튼을 불러오지 못했습니다.'))}},100)};s.onerror=()=>{driveApi=null;reject(new Error('Google Drive 스크립트 로드 실패'))};document.head.append(s)});return driveApi}
async function driveMedia(d){const kind=d.kind==='audio'?'audio':'video',row=kind==='audio'?'#driveAudioRow':'#driveVideoRow',box=kind==='audio'?'#driveAudioWidget':'#driveVideoWidget';S.driveMedia[kind]=true;show('#driveMedia',true);show(row,true);q(box).textContent='Google 버튼 준비 중…';try{const g=await loadDriveApi();q(box).replaceChildren();g.savetodrive.render(q(box),{src:d.src,filename:d.filename,sitename:'유튜브다운로드'});status((kind==='audio'?'음성':'영상')+' Drive 버튼 준비됨')}catch(e){q(box).textContent='버튼 준비 실패';status(e?.message||'Drive 버튼 준비 실패')}render()}
q('#googleConnect').onclick=()=>action('google-connect');q('#createStorage').onclick=()=>action('create-storage');
qa('.type').forEach(b=>b.onclick=()=>{const t=b.dataset.type;S.types.has(t)?S.types.delete(t):S.types.add(t);clearDrive();render()});qa('.target').forEach(b=>b.onclick=()=>{S.target=b.dataset.target;clearDrive();render()});q('#commentsCheck').onchange=e=>show('#commentOptions',e.target.checked);
qa('.star').forEach(b=>b.onclick=()=>{const n=+b.dataset.star;S.priority=S.priority===n?0:n;qa('.star').forEach(x=>{const on=+x.dataset.star<=S.priority;x.classList.toggle('on',on);x.textContent=on?'★':'☆'})});
q('#connectFile').onclick=()=>{const u=prompt('추가로 연결할 Google Sheets 주소');if(u?.trim())action('connect-file',{sheetUrl:u.trim()})};q('#driveFile').onchange=e=>action('select-file',{fileId:e.target.value});q('#driveSheet').onchange=e=>action('select-sheet',{fileId:q('#driveFile').value,sheetName:e.target.value});q('#newSheet').onclick=()=>{const fileId=q('#driveFile').value,n=prompt('새 시트 이름');if(fileId&&n?.trim())action('create-sheet',{fileId,sheetName:n.trim()})};q('#newCategory').onclick=()=>{const fileId=q('#driveFile').value,sheetName=q('#driveSheet').value,n=prompt('새 카테고리 이름');if(fileId&&sheetName&&n?.trim())action('add-category',{fileId,sheetName,category:n.trim()})};q('#openFile').onclick=()=>action('open-file',{fileId:q('#driveFile').value});q('#openSheet').onclick=()=>action('open-sheet',{fileId:q('#driveFile').value,sheetName:q('#driveSheet').value});q('#openExisting').onclick=()=>action('open-existing',{duplicate:S.duplicate});q('#close').onclick=()=>action('close');
q('#save').onclick=()=>{if(!S.types.size)return status('가져올 항목을 선택하세요.');if(!S.target)return status('저장 위치를 선택하세요.');const p=payload();if(S.types.has('video')&&!p.video.id)return status('저장 가능한 영상이 없습니다.');if(S.types.has('audio')&&!p.audio.id)return status('저장 가능한 음성이 없습니다.');if(S.target==='drive'&&S.types.has('data')&&(!p.drive.fileId||!p.drive.sheetName))return status('저장할 파일과 시트를 선택하세요.');S.busy=true;clearDrive();render();status(S.target==='local'?'로컬 저장 준비 중…':'저장 준비 중…');action(S.target==='local'?'save-local':'save-drive',p)};
addEventListener('message',e=>{const d=e.data||{};if(token&&d.token!==token)return;if(d.type==='YT_TOOL_INIT')init(d);else if(d.type==='YT_TOOL_STATUS'){S.busy=d.state==='working';render();status(d.message||'',!!d.setup)}else if(d.type==='YT_TOOL_OPTIONS')applyOptions(d);else if(d.type==='YT_TOOL_SETUP'){S.configured=!!d.configured;applyOptions(d);render();status(d.message||'',true)}else if(d.type==='YT_TOOL_DUPLICATE'){S.duplicate=d.duplicate||null;render()}else if(d.type==='YT_TOOL_DRIVE_MEDIA')driveMedia(d)});
window.YTToolUI={formatData,getState:payload};emit({type:'YT_TOOL_READY'});render();
})();
</script>
